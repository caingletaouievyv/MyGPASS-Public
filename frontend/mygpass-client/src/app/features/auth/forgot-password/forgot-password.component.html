<main class="auth-page">
  <section class="auth-card" aria-label="Forgot Password form">
    <header class="brand-block">
      <div class="brand-mark" aria-label="GPASS branding">
        <span class="brand-wordmark">MyGPASS</span>
      </div>
    </header>

    <div class="auth-header">
      <h1>
        Reset Password
        <div class="tooltip">
          <button type="button" class="help-icon" aria-label="Help information">?</button>
          <span class="tooltip-text">
            Enter the email address associated with your account, and we'll send you a link to reset your password.
          </span>
        </div>
      </h1>
    </div>

    <div class="success-message" *ngIf="successMessage()" role="alert" aria-live="polite">
      {{ successMessage() }}
    </div>

    <div class="error-message" *ngIf="errorMessage()" role="alert" aria-live="polite">
      {{ errorMessage() }}
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate *ngIf="!successMessage()">

      <div class="field-group">
        <label for="forgot-email">Email Address</label>
        <input
          id="forgot-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="Enter your email address"
          [attr.aria-invalid]="emailControl.invalid && (emailControl.touched || emailControl.dirty)"
          [class.input-error]="emailControl.invalid && (emailControl.touched || emailControl.dirty)"
        />

        <div
          class="error-message"
          *ngIf="emailControl.hasError('required') && (emailControl.touched || emailControl.dirty)"
          aria-live="polite"
        >
          Email address is required.
        </div>
        <div
          class="error-message"
          *ngIf="emailControl.hasError('email') && (emailControl.touched || emailControl.dirty)"
          aria-live="polite"
        >
          Please enter a valid email address.
        </div>
      </div>

      <button
        type="submit"
        class="primary-button"
        [disabled]="forgotPasswordForm.invalid || isSubmitting()"
      >
        <ng-container *ngIf="!isSubmitting(); else loadingState">Send Reset Link</ng-container>
        <ng-template #loadingState>
          <span class="spinner" aria-label="Loading"></span>
          Sending...
        </ng-template>
      </button>
    </form>

    <p class="switch-text">
      Remember your password?
      <a routerLink="/login">Back to Login</a>
    </p>
  </section>
</main>
