<header class="site-header">
  <div class="brand">
    <a class="brand-mark" routerLink="/booking/route" aria-label="GPASS home">
      <img src="/assets/MyGPASS.png" alt="GPASS" />
    </a>
  </div>

  <nav class="header-nav" aria-label="Primary navigation">
    @if (isAuthenticated() || isGuestSession()) {
    <a
      routerLink="/booking/route"
      [class.active]="isActive('/booking/route')"
      class="nav-link nav-home">
      Home
    </a>
    }
    @if (isAuthenticated()) {
    <a 
      routerLink="/account" 
      [class.active]="isActive('/account')"
      class="nav-link nav-account"
      aria-current="page">
      Account
    </a>
    <a 
      routerLink="/history" 
      [class.active]="isActive('/history')"
      class="nav-link nav-history"
      aria-current="page">
      History
    </a>
    <button 
      type="button" 
      class="nav-logout" 
      (click)="logout()" 
      aria-label="Logout from GPASS">
      Logout
    </button>
    } @else if (isGuestSession()) {
    <a
      routerLink="/login"
      class="nav-logout"
      aria-label="Login to GPASS">
      Login
    </a>
    }
  </nav>
</header>
