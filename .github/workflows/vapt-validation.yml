name: VAPT Preparation Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "vapt/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build, tests, dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mygpass-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mygpass-client/package-lock.json
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Run frontend tests
        if: always() && steps.install.outcome == 'success'
        run: npm test -- --watch=false
      - name: Build frontend
        if: always() && steps.install.outcome == 'success'
        run: npm run build
      - name: Audit dependencies
        if: always() && steps.install.outcome == 'success'
        run: npm audit --audit-level=high

  backend:
    name: Backend build, tests, dependency vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/MyGPASS.Api.Tests/MyGPASS.Api.Tests.csproj
      - name: Build API
        run: dotnet build backend/MyGPASS.Api/MyGPASS.Api.csproj --no-restore --configuration Release --nologo
      - name: Run backend tests
        run: dotnet test backend/MyGPASS.Api.Tests/MyGPASS.Api.Tests.csproj --no-restore --configuration Release --nologo
      - name: Check vulnerable NuGet packages
        run: dotnet list backend/MyGPASS.Api/MyGPASS.Api.csproj package --vulnerable --include-transitive
